name: Weekly CFB Betting Report

on:
  schedule:
    - cron: '0 14 * * 2'  # Tuesday 9am CT (14:00 UTC)
  workflow_dispatch:        # lets you trigger it manually anytime

permissions:
  contents: write

jobs:
  generate-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python data/fetch_stats.py

      - name: Fetch odds
        # Needs CFBD_API_KEY too now -- fetch_odds.py determines week/year
        # via fetch_stats.get_current_week(), which calls CFBD's /calendar.
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python data/fetch_odds.py

      - name: Generate weekly card (EPA-only baseline)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python models/card_generator.py

      - name: Build dashboard
        # Runs even if an earlier step failed, so the published page can
        # say so (stale banner, per-section health) instead of silently
        # keeping last week's numbers up with no indication anything broke.
        if: always()
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python models/build_dashboard.py

      - name: Commit and push output
        if: always()
        run: |
          git config user.name "cfb-bot"
          git config user.email "bot@cfb-betting-system"
          git add docs/ data/cfb.db
          git diff --staged --quiet || git commit -m "Week auto-report $(date +'%Y-%m-%d')"
          git push
