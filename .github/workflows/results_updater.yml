name: Weekly Results Updater

on:
  schedule:
    - cron: '0 11 * * 1'  # Monday 6am CT (11:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update results and retrain weights
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python models/update_results.py

      - name: Commit updated data
        # Two fixes here:
        # 1. `tracker/` is removed from `git add` — nothing in the codebase has ever
        #    written that directory, so `git add` was hitting an unmatched pathspec and
        #    failing with a fatal error (exit 128) on every run, before `git commit` ever
        #    executed. That's why models/weights.json has no history: this step was
        #    silently failing every single week.
        # 2. data/cfb.db added — update_results.py now writes final scores into `games`
        #    and settles `picks` in the DB (in addition to the docs/data/ JSON), and this
        #    is also what fetch_closing_lines() reads for CLV, replacing the old
        #    data/spreads/current_week_*.json read that never survived to Monday.
        run: |
          git config user.name "cfb-bot"
          git config user.email "bot@cfb-betting-system"
          git add docs/data/ models/weights.json data/cfb.db
          git diff --staged --quiet || git commit -m "Results update $(date +'%Y-%m-%d')"
          git push